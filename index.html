<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f4f0e9">
<title>Hörbuch</title>
<style>
:root{--bg:#f4f0e9;--paper:#fbf9f5;--ink:#292722;--muted:#827d73;--line:#e7e1d7;--accent:#9b756d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{width:min(680px,100% - 32px);margin:0 auto;padding:28px 0 54px}
.cover-wrap{width:min(330px,82%);margin:0 auto 24px}
.cover{display:block;width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:3px;background:#dfd1c8}
.placeholder{aspect-ratio:3/4;display:flex;align-items:center;justify-content:center;background:linear-gradient(145deg,#eadfd5,#c7ada3);font:32px Georgia,serif;color:#66544d}
.current{font-size:14px;text-align:center;margin:0 0 15px;color:var(--ink)}
.player{background:var(--paper);padding:16px 18px 13px;border:1px solid var(--line);border-radius:5px}
.controls{display:flex;align-items:center;gap:13px}
.play-main,.play-chapter{border:0;border-radius:50%;background:var(--accent);color:white;cursor:pointer;display:grid;place-items:center;flex:none}
.play-main{width:42px;height:42px;font-size:16px}
.track{flex:1;min-width:0}
input[type=range]{width:100%;accent-color:var(--accent);display:block;margin:0;cursor:pointer}
.times{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:7px}
h2{font:400 23px Georgia,serif;margin:30px 0 8px}
.chapter-list{list-style:none;margin:0;padding:0}
.chapter{display:grid;grid-template-columns:38px 1fr 52px;align-items:center;gap:12px;padding:14px 3px;border-bottom:1px solid var(--line)}
.play-chapter{width:34px;height:34px;font-size:13px}
.chapter.active .chapter-title{color:var(--accent)}
.chapter-title{font-size:14px}
.chapter-desc{font-size:12px;color:var(--muted);margin-top:3px}
.duration{font-size:11px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
@media(max-width:480px){main{padding-top:18px}.cover-wrap{width:min(290px,78%);margin-bottom:19px}h2{margin-top:25px}}
</style>
</head>
<body>
<main>
  <div class="cover-wrap" id="coverArea"><div class="placeholder">♡</div></div>
  <p class="current" id="nowPlaying">Wähle ein Kapitel</p>
  <section class="player">
    <div class="controls">
      <button class="play-main" id="playBtn" aria-label="Abspielen">▶</button>
      <div class="track">
        <input id="seek" type="range" min="0" max="1000" value="0" aria-label="Wiedergabeposition">
        <div class="times"><span id="currentTime">0:00</span><span id="duration">0:00</span></div>
      </div>
    </div>
    <audio id="audio" preload="metadata"></audio>
  </section>
  <h2>Kapitel</h2>
  <ol class="chapter-list" id="chapterList"></ol>
</main>
<script>
const audio=document.getElementById('audio'),list=document.getElementById('chapterList'),playBtn=document.getElementById('playBtn'),seek=document.getElementById('seek');
let chapters=[],current=-1;
const fmt=s=>{if(!Number.isFinite(s))return'0:00';return `${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`};
function updateRows(){[...list.children].forEach((el,i)=>{el.classList.toggle('active',i===current);el.querySelector('button').textContent=i===current&&!audio.paused?'Ⅱ':'▶'})}
function playChapter(i){if(i<0||i>=chapters.length)return;current=i;audio.src=chapters[i].file;audio.load();document.getElementById('nowPlaying').textContent=`Kapitel ${String(i+1).padStart(2,'0')} · ${chapters[i].title}`;document.getElementById('currentTime').textContent='0:00';document.getElementById('duration').textContent=chapters[i].duration||'0:00';seek.value=0;updateRows();audio.play().then(()=>{playBtn.textContent='Ⅱ';updateRows()}).catch(()=>{playBtn.textContent='▶';updateRows()})}
function render(){list.innerHTML='';chapters.forEach((c,i)=>{const li=document.createElement('li');li.className='chapter';const btn=document.createElement('button');btn.className='play-chapter';btn.textContent='▶';btn.setAttribute('aria-label',`Kapitel ${i+1} abspielen`);btn.addEventListener('click',()=>playChapter(i));const info=document.createElement('div');const title=document.createElement('div');title.className='chapter-title';title.textContent=c.title;info.appendChild(title);if(c.description){const desc=document.createElement('div');desc.className='chapter-desc';desc.textContent=c.description;info.appendChild(desc)}const duration=document.createElement('div');duration.className='duration';duration.textContent=c.duration||'—';li.append(btn,info,duration);list.appendChild(li)});updateRows()}
fetch('chapters.json').then(r=>r.json()).then(data=>{document.title=data.title||'Hörbuch';if(data.cover){const img=document.createElement('img');img.className='cover';img.src=data.cover;img.alt='';document.getElementById('coverArea').replaceChildren(img)}chapters=data.chapters||[];render()}).catch(()=>{document.getElementById('nowPlaying').textContent='Kapitel konnten nicht geladen werden'});
playBtn.addEventListener('click',()=>{if(current<0){if(chapters.length)playChapter(0);return}if(audio.paused){audio.play();playBtn.textContent='Ⅱ'}else{audio.pause();playBtn.textContent='▶'}updateRows()});
audio.addEventListener('play',()=>{playBtn.textContent='Ⅱ';updateRows()});audio.addEventListener('pause',()=>{playBtn.textContent='▶';updateRows()});
audio.addEventListener('ended',()=>{if(current+1<chapters.length)playChapter(current+1);else{playBtn.textContent='▶';updateRows()}});
audio.addEventListener('loadedmetadata',()=>{document.getElementById('duration').textContent=fmt(audio.duration)});
audio.addEventListener('timeupdate',()=>{if(audio.duration){seek.value=audio.currentTime/audio.duration*1000;document.getElementById('currentTime').textContent=fmt(audio.currentTime);document.getElementById('duration').textContent=fmt(audio.duration)}});
seek.addEventListener('input',()=>{if(audio.duration)audio.currentTime=seek.value/1000*audio.duration});
</script>
</body></html>
